;; PgBouncer — transaction pooling for the School ERP. The backend (asyncpg) connects here on
;; :6432 with DB_PGBOUNCER=true (asyncpg prepared statements disabled). The per-transaction
;; `SET LOCAL app.current_tenant` (RLS) is preserved: transaction pooling pins one server
;; backend for the whole transaction, so SET LOCAL applies to every statement and resets on commit.

[databases]
school_erp = host=postgres port=5432 dbname=school_erp

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; PostgreSQL 15 stores SCRAM verifiers. Put educore_app's verifier in userlist.txt
;; (see userlist.txt.example for how to generate it).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
;; asyncpg sends extra_float_digits on connect; PgBouncer must ignore it under txn pooling.
ignore_startup_parameters = extra_float_digits

;; Connection math (see DEPLOY_ORACLE.md): backend keeps DB_POOL_SIZE+DB_MAX_OVERFLOW (=30)
;; client conns per replica TO PgBouncer; PgBouncer multiplexes them onto default_pool_size
;; server conns to Postgres. Keep default_pool_size well under Postgres max_connections (100).
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_lifetime = 3600
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
