name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The app + scripts read these (settings); a real DB means the DB-backed
      # tests (RLS isolation, payment math) actually run instead of skipping.
      POSTGRES_SERVER: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_erp
      POSTGRES_PORT: "5432"
      APP_DB_USER: educore_app
      APP_DB_PASSWORD: educore_app
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate ephemeral RS256 keypair for JWT tests
        # Never commit a real private key — mint a throwaway one per run and export the
        # \n-escaped PEMs to the job env (read by app/core/config.py).
        run: python generate_jwt_keys.py --env >> "$GITHUB_ENV"
      - name: Ruff (lint)
        run: ruff check app tests *.py
      - name: Black (format check)
        run: black --check app tests *.py
      - name: isort (import order)
        run: isort --check-only app tests *.py
      - name: Set up database (schema + scripts + RLS)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/school_erp" -v ON_ERROR_STOP=1 -f ../db/schema.sql
          python create_academics_tables.py
          python create_student_portal_tables.py
          python create_messaging_tables.py
          python create_activities_tables.py
          python create_feature_tables.py
          python migrate_student_fields.py
          python migrate_db_hardening.py
          python migrate_class.py
          python migrate_fee_schedule.py
          python migrate_admissions_enquiry.py
          python enable_rls.py
      - name: Pytest (incl. DB-backed RLS + payment tests)
        run: pytest

  frontend:
    name: Frontend (type check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
