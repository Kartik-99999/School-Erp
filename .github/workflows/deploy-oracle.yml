# Continuous Deployment to the Oracle Cloud Always Free (A1) VM over SSH.
#
# Runs after CI succeeds on main, SSHes to the VM, pulls, rebuilds the images, runs the DB
# bring-up Job ONLY when schema/migrations changed, then rolls the stack. No cloud SDK needed.
#
# Repo SECRETS required:
#   ORACLE_HOST       public IP / hostname of the A1 VM
#   ORACLE_SSH_USER   deploy user (e.g. ubuntu / opc)
#   ORACLE_SSH_KEY    private SSH key (PEM) for that user
# The app secrets live ONLY in /opt/school-erp/deploy/.env on the VM (never in GitHub).
name: Deploy (Oracle)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    # Auto-deploy stays DORMANT (job skipped, not failed) until you set repo variable
    # DEPLOY_ENABLED=true — do that once the Oracle VM + ORACLE_* SSH secrets exist.
    # Manual 'Run workflow' (workflow_dispatch) always works regardless.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect DB-affecting changes
        id: dbchanges
        run: |
          if git diff --name-only HEAD~1 HEAD \
             | grep -qE '^(db/schema\.sql|backend/(migrate_|create_).*\.py|backend/enable_rls\.py|backend/apply_schema\.py|backend/db_bringup\.sh)$'; then
            echo "migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: MIGRATE
          script: |
            set -euo pipefail
            export MIGRATE="${{ steps.dbchanges.outputs.migrate }}"
            cd /opt/school-erp
            git fetch --all --prune
            git reset --hard origin/main
            cd deploy
            docker compose build
            # Bring up data services first so migrations have a DB.
            docker compose up -d postgres pgbouncer redis
            if [ "$MIGRATE" = "true" ]; then
              echo "schema/migrations changed -> running DB bring-up (enable_rls.py runs last)"
              docker compose --profile migrate run --rm migrate
            fi
            # Roll the app + edge (new images; restart picks up the new revision).
            docker compose up -d
            docker image prune -f
